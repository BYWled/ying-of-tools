# Cloudflare Workers 静态资产部署配置
# Workers Builds 连接 GitHub 后：构建命令 `pnpm build`，部署命令 `npx wrangler deploy`
name = "ying-of-tools"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# clean URL：/tool/xxx 直接命中构建期生成的 tool/xxx.html（每工具独立 SEO meta）
html_handling = "auto-trailing-slash"
